name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build packages
        run: vp run -r build

      - name: Run linters
        run: vp check

      - name: Type check
        run: vp run -r typecheck

      - name: Run tests
        env:
          TPEG_NATIVE_REQUIRED: "1"
        run: vp test
